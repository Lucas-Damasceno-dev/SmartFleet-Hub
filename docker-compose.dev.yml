# ==========================================
# SmartFleet Hub - Local Development Environment
# Docker Compose for Development
# ==========================================

name: smartfleet-dev

services:
  # ============================================
  # DATA LAYER
  # ============================================
  
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: sf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfleet_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-smartfleet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - sf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfleet} -d ${POSTGRES_DB:-smartfleet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sf-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sf-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # EVENT STREAMING (Kafka)
  # ============================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sf-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sf-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sf-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: sf-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://sf-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sf-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sf-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartfleet-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: sf-kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - sf-net
    restart: unless-stopped

  # ============================================
  # CDC - Change Data Capture (Debezium)
  # ============================================
  
  debezium:
    image: debezium/connect:2.5
    container_name: sf-debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: sf-kafka:29092
      GROUP_ID: smartfleet-connect
      CONFIG_STORAGE_TOPIC: sf_connect_configs
      OFFSET_STORAGE_TOPIC: sf_connect_offsets
      STATUS_STORAGE_TOPIC: sf_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    networks:
      - sf-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================
  # SECURITY (Keycloak)
  # ============================================
  
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sf-keycloak
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sf-postgres:5432/${POSTGRES_DB:-smartfleet}
      KC_DB_USERNAME: ${POSTGRES_USER:-smartfleet}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-smartfleet_secret_dev}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    networks:
      - sf-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================
  # OBSERVABILITY
  # ============================================
  
  tempo:
    image: grafana/tempo:latest
    container_name: sf-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/docker/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - sf-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sf-grafana
    depends_on:
      - tempo
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sf-net
    restart: unless-stopped

# ============================================
# NETWORKS
# ============================================
networks:
  sf-net:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
  redis_data:
  tempo_data:
  grafana_data:
