<div class="h-screen w-screen overflow-hidden bg-surface-900 flex">
  <!-- Sidebar -->
  @if (sidebarOpen()) {
    <app-sidebar></app-sidebar>
  }

  <!-- Main Content -->
  <div class="flex-1 flex flex-col" [class.lg:ml-64]="sidebarOpen()">
    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Dashboard Grid -->
    <main class="flex-1 p-4 lg:p-6 overflow-hidden">
      <div class="h-full grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
        <!-- Map Section (main area) -->
        <div class="lg:col-span-7 xl:col-span-8 h-full min-h-[400px]">
          <app-fleet-map></app-fleet-map>
        </div>

        <!-- Right Panel -->
        <div class="lg:col-span-5 xl:col-span-4 h-full flex flex-col gap-4 lg:gap-6 overflow-hidden">
          @if (selectedOrder()) {
            <!-- Order Details -->
            <div class="flex-1 min-h-0">
              <app-order-details 
                [order]="selectedOrder()"
                (close)="onCloseOrderDetails()">
              </app-order-details>
            </div>
          } @else {
            <!-- Order List -->
            <div class="flex-1 min-h-0">
              <app-order-list
                [selectedOrderId]="selectedOrder()?.id"
                (orderSelected)="onOrderSelected($event)">
              </app-order-list>
            </div>
          }
        </div>
      </div>
    </main>
  </div>
</div>

<router-outlet></router-outlet>
