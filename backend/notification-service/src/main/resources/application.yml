spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.smartfleet.*

  # OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/smartfleet}

# Server Configuration
server:
  port: ${SERVER_PORT:8086}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Notification Service Configuration
notification:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:./firebase-admin.json}
    enabled: ${FIREBASE_ENABLED:false}
  templates:
    order-assigned: "Driver {driverName} is on the way!"
    nearby: "Driver is arriving (within 200m)"
    delivered: "Package delivered. Rate your experience."
