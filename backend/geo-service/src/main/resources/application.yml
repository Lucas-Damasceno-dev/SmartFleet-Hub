spring:
  application:
    name: geo-service
  threads:
    virtual:
      enabled: true

  # Database Configuration (PostGIS)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartfleet}
    username: ${DB_USER:smartfleet}
    password: ${DB_PASSWORD:smartfleet_secret_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

  # OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/smartfleet}

# Server Configuration
server:
  port: ${SERVER_PORT:8083}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Geo Service Specific Configuration
geo:
  arrival-detection-radius-meters: 200
  eta-recalculation-interval-minutes: 5
  route-deviation-threshold-meters: 500
